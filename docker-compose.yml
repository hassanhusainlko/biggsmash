services:
  pgdatabase:
    image: postgres:16-alpine
    container_name: biggsmash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-biggsmash}
      POSTGRES_USER: ${POSTGRES_USER:-biggsmash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biggsmash}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  django:
    build:
      context: .
      dockerfile: Dockerfile
    image: biggsmash-django
    container_name: biggsmash-django
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-biggsmash}
      POSTGRES_USER: ${POSTGRES_USER:-biggsmash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biggsmash}
      POSTGRES_HOST: pgdatabase
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-this-secret-key-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,biggsmashoutreach.com,www.biggsmashoutreach.com}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - backend
    depends_on:
      pgdatabase:
        condition: service_healthy
    expose:
      - "8000"

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: biggsmash-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@biggsmash.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - backend
    depends_on:
      pgdatabase:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: biggsmash-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    networks:
      - backend
    depends_on:
      - django

volumes:
  postgres_data:
  pgadmin_data:
  static_volume:
  media_volume:

networks:
  backend:
    driver: bridge
