services:
  pgdatabase:
    image: postgres:16-alpine
    container_name: biggsmash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-biggsmash}
      POSTGRES_USER: ${POSTGRES_USER:-biggsmash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biggsmash}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  django:
    build:
      context: .
      dockerfile: Dockerfile
    image: biggsmash-django
    container_name: biggsmash-django
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-biggsmash}
      POSTGRES_USER: ${POSTGRES_USER:-biggsmash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biggsmash}
      POSTGRES_HOST: pgdatabase
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-this-secret-key-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,biggsmashoutreach.com,www.biggsmashoutreach.com,169.58.1.150}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - backend
    depends_on:
      pgdatabase:
        condition: service_healthy
    expose:
      - "8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 8001), timeout=2).close()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: biggsmash-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@biggsmashoutreach.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5051}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - backend
    depends_on:
      pgdatabase:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: biggsmash-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      # Mount your certificates when HTTPS is enabled:
      # - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - backend
    depends_on:
      django:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
  static_volume:
  media_volume:

networks:
  backend:
    driver: bridge
